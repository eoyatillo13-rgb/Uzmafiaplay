<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Play Mafia - UzMafiaplay</title>
  <style>
    :root {
      --bg-color: #0b0e14;
      --card-bg: #151a23;
      --card-border: #222936;
      --accent-gold: #e5ac40;
      --accent-purple: #6a44f2;
      --accent-green: #2ecc71;
      --text-main: #ffffff;
      --text-sub: #7a8290;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 15px;
      box-sizing: border-box;
      user-select: none;
    }

    /* Top Logo Header */
    .top-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin: 10px 0 20px 0;
    }

    .logo-img {
      width: 65px;
      height: 65px;
      border-radius: 50%;
      border: 2px solid var(--accent-gold);
      box-shadow: 0 0 15px rgba(229, 172, 64, 0.4);
      object-fit: cover;
    }

    .logo-title {
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 2px;
      background: linear-gradient(135deg, #fce072, #e5ac40);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: 0;
      text-shadow: 0 2px 10px rgba(0,0,0,0.8);
    }

    /* Icon Bar Row */
    .icon-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding: 0 5px;
    }

    .icon-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #19202c;
      border: 1px solid #2a3344;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
      cursor: pointer;
      font-size: 20px;
    }

    /* Main Actions Bar */
    .action-row {
      display: flex;
      gap: 12px;
      margin-bottom: 25px;
    }

    .btn-add {
      width: 65px;
      height: 60px;
      background: linear-gradient(145deg, #2b2112, #18120a);
      border: 2px solid var(--accent-gold);
      border-radius: 18px;
      color: var(--accent-gold);
      font-size: 28px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(229, 172, 64, 0.2);
    }

    .btn-quick {
      flex: 1;
      height: 60px;
      background: linear-gradient(135deg, #7b52ff, #5022ed);
      border: none;
      border-radius: 18px;
      color: white;
      font-size: 17px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(106, 68, 242, 0.4);
    }

    .section-title {
      font-size: 13px;
      color: var(--text-sub);
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      text-align: left;
      margin-bottom: 12px;
    }

    /* Room Cards List */
    .room-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }

    .room-info-left { text-align: left; }
    .room-header { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .badge-pro { background: var(--accent-gold); color: #000; font-size: 10px; font-weight: 900; padding: 2px 6px; border-radius: 6px; }
    .room-name { font-size: 16px; font-weight: bold; color: #fff; }
    .room-players-count { color: var(--accent-green); font-size: 14px; font-weight: bold; }
    .room-users-avatars { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-sub); }
    .arrow-right { color: var(--text-sub); font-size: 18px; }

    /* Seats Grid */
    .seats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin: 15px 0;
    }

    .seat-box {
      background: var(--card-bg);
      border: 1px dashed var(--card-border);
      border-radius: 16px;
      padding: 16px 10px;
      text-align: center;
      min-height: 85px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .seat-box.occupied {
      border: 1px solid var(--accent-purple);
      background: #1c2230;
    }

    .player-avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 2px solid var(--accent-gold);
      margin-bottom: 6px;
      object-fit: cover;
    }

    /* Roles Grid */
    .roles-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-top: 15px;
    }

    .role-card {
      background: #19202c;
      border: 1px solid var(--card-border);
      border-radius: 16px;
      overflow: hidden;
      text-align: center;
      padding-bottom: 10px;
    }

    .role-img {
      width: 100%;
      height: 120px;
      object-fit: cover;
    }

    .role-name {
      font-size: 14px;
      font-weight: bold;
      color: #fff;
      margin-top: 8px;
    }

    /* Modals */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.85);
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    .modal-content {
      background: #151a23;
      border: 1px solid var(--card-border);
      padding: 22px;
      border-radius: 24px;
      width: 90%;
      max-width: 380px;
      max-height: 85vh;
      overflow-y: auto;
      text-align: left;
      box-sizing: border-box;
    }

    input[type="text"], input[type="number"] {
      width: 100%;
      padding: 14px;
      margin: 8px 0 16px 0;
      border-radius: 14px;
      border: 1px solid var(--card-border);
      background: #0b0e14;
      color: #fff;
      font-size: 15px;
      box-sizing: border-box;
      outline: none;
    }

    .btn-main {
      background: linear-gradient(135deg, var(--accent-purple), #5022ed);
      color: white;
      font-weight: bold;
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      font-size: 16px;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <!-- Asosiy Bosh Sahifa -->
  <div id="home-view">
    <div class="top-header">
      <img src="https://images.unsplash.com/photo-1534447677768-be436bb09401?q=80&w=200" class="logo-img" alt="Logo">
      <div class="logo-title">PLAY MAFIA</div>
    </div>

    <!-- Ikonkalar paneli -->
    <div class="icon-row">
      <div class="icon-btn" title="Reyting">☀️</div>
      <div class="icon-btn" title="Tarix">⏳</div>
      <div class="icon-btn" id="open-rules-btn" title="O'yin qoidalari">📖</div>
      <div class="icon-btn" title="Yutuqlar">🏆</div>
      <div class="icon-btn" title="Choyxona">🏕️</div>
      <div class="icon-btn" title="Profil">👑</div>
    </div>

    <!-- Amal tugmalari -->
    <div class="action-row">
      <button class="btn-add" id="open-create-btn">┼</button>
      <button class="btn-quick" id="quick-join-btn">⚡ Tezkor qo'shilish</button>
    </div>

    <div class="section-title">Ochiq xonalar</div>
    <div id="rooms-container">
      <p style="color: var(--text-sub); font-size: 14px; text-align: center; margin-top: 30px;">Hozircha ochiq xonalar yo'q...</p>
    </div>
  </div>

  <!-- O'yin xonasi ko'rinishi -->
  <div id="room-view" style="display: none;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
      <h3 id="room-header-title" style="color: var(--accent-gold); margin: 0;">Xona</h3>
      <button onclick="location.reload()" style="background: #e74c3c; border: none; color: white; padding: 8px 14px; border-radius: 10px; font-weight: bold; cursor: pointer;">Chiqish</button>
    </div>

    <div id="my-role-card" style="font-size: 15px; font-weight: bold; color: var(--accent-green); margin-bottom: 12px; background: var(--card-bg); border: 1px solid var(--card-border); padding: 12px; border-radius: 14px;">Rol kutilmoqda...</div>
    
    <div class="section-title">O'rindiqlar:</div>
    <div class="seats-grid" id="seats-container"></div>

    <button id="start-game-btn" class="btn-main" style="display: none; background: linear-gradient(135deg, #2ecc71, #27ae60);">O'yinni boshlash ▶</button>
  </div>

  <!-- O'yin Qoidalari Modali -->
  <div class="modal" id="rules-modal">
    <div class="modal-content">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <h3 style="color: var(--accent-gold); margin: 0;">📖 O'yin rollari</h3>
        <button id="close-rules-btn" style="background:none; border:none; color:#fff; font-size:18px; cursor:pointer;">✕</button>
      </div>
      
      <div class="roles-grid">
        <div class="role-card">
          <img src="https://images.unsplash.com/photo-1622253692010-333f2da6031d?q=80&w=300" class="role-img" alt="Doktor">
          <div class="role-name">Doktor</div>
        </div>
        <div class="role-card">
          <img src="https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?q=80&w=300" class="role-img" alt="Bezori">
          <div class="role-name">Bezori</div>
        </div>
        <div class="role-card">
          <img src="https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?q=80&w=300" class="role-img" alt="Rais">
          <div class="role-name">Rais</div>
        </div>
        <div class="role-card">
          <img src="https://images.unsplash.com/photo-1519085360753-af0119f7cbe7?q=80&w=300" class="role-img" alt="Qassob">
          <div class="role-name">Qassob</div>
        </div>
        <div class="role-card">
          <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?q=80&w=300" class="role-img" alt="Mirshab">
          <div class="role-name">Mirshab</div>
        </div>
        <div class="role-card">
          <img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?q=80&w=300" class="role-img" alt="Mafiya">
          <div class="role-name">Mafiya</div>
        </div>
        <div class="role-card">
          <img src="https://images.unsplash.com/photo-1519345182560-3f2917c472ef?q=80&w=300" class="role-img" alt="Mafiaboshi">
          <div class="role-name">Mafiaboshi</div>
        </div>
        <div class="role-card">
          <img src="https://images.unsplash.com/photo-1492562080023-ab3db95bfbce?q=80&w=300" class="role-img" alt="Xufya">
          <div class="role-name">Xufya</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Xona ochish va qo'shilish modallari -->
  <div class="modal" id="create-modal">
    <div class="modal-content">
      <h3 style="color: var(--accent-gold); margin-top:0;">Yangi xona</h3>
      <input type="text" id="creator-name" placeholder="Ismingiz...">
      <input type="text" id="room-name-input" placeholder="Xona nomi (masalan: 7-Xona)">
      <input type="number" id="max-players-input" value="16" min="3" max="16">
      <button class="btn-main" id="confirm-create">Yaratish</button>
      <button id="close-create-btn" style="background:none; border:none; color: var(--text-sub); margin-top:15px; cursor:pointer; width:100%; text-align:center;">Bekor qilish</button>
    </div>
  </div>

  <div class="modal" id="join-modal">
    <div class="modal-content">
      <h3 style="color: var(--accent-gold); margin-top:0;">Xonaga qo'shilish</h3>
      <input type="text" id="joiner-name" placeholder="Ismingiz...">
      <button class="btn-main" id="confirm-quick-join">Qo'shilish</button>
      <button id="close-join-btn" style="background:none; border:none; color: var(--text-sub); margin-top:15px; cursor:pointer; width:100%; text-align:center;">Bekor qilish</button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, onValue, push, get, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCWlfG8IlwFQuSm96CPQY4DmfVZJvg606w",
      authDomain: "uzmafiaplay-fbe1b.firebaseapp.com",
      databaseURL: "https://uzmafiaplay-fbe1b-default-rtdb.firebaseio.com",
      projectId: "uzmafiaplay-fbe1b",
      storageBucket: "uzmafiaplay-fbe1b.firebasestorage.app",
      messagingSenderId: "897774965825",
      appId: "1:897774965825:web:90c821fbcc7972120622c0"
    };

    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);

    let currentRoomId = null;
    let myPlayerId = null;
    let isHost = false;
    let selectedRoomToJoin = null;

    const homeView = document.getElementById("home-view");
    const roomView = document.getElementById("room-view");
    const createModal = document.getElementById("create-modal");
    const joinModal = document.getElementById("join-modal");
    const rulesModal = document.getElementById("rules-modal");

    document.getElementById("open-create-btn").onclick = () => createModal.style.display = "flex";
    document.getElementById("open-rules-btn").onclick = () => rulesModal.style.display = "flex";

    document.getElementById("close-create-btn").onclick = () => createModal.style.display = "none";
    document.getElementById("close-join-btn").onclick = () => joinModal.style.display = "none";
    document.getElementById("close-rules-btn").onclick = () => rulesModal.style.display = "none";

    document.getElementById("quick-join-btn").onclick = async () => {
      const snapshot = await get(ref(database, 'rooms'));
      if (!snapshot.exists()) return alert("Hozircha ochiq xonalar yo'q!");
      
      let foundRoom = null;
      snapshot.forEach((child) => {
        if (child.val().status === "waiting" && !foundRoom) {
          foundRoom = child.key;
        }
      });

      if (!foundRoom) return alert("Hozircha ochiq xonalar yo'q!");
      selectedRoomToJoin = foundRoom;
      joinModal.style.display = "flex";
    };

    document.getElementById("confirm-create").onclick = () => {
      const name = document.getElementById("creator-name").value.trim();
      const roomTitle = document.getElementById("room-name-input").value.trim() || "Xona";
      const maxPlayers = parseInt(document.getElementById("max-players-input").value) || 16;

      if (!name) return alert("Ismingizni kiriting!");

      currentRoomId = Math.floor(1000 + Math.random() * 9000);
      isHost = true;

      set(ref(database, 'rooms/' + currentRoomId), {
        roomName: roomTitle,
        createdBy: name,
        maxPlayers: maxPlayers,
        status: "waiting",
        createdAt: Date.now()
      });

      const playerRef = push(ref(database, 'rooms/' + currentRoomId + '/players'));
      myPlayerId = playerRef.key;
      set(playerRef, { name: name, isHost: true, role: "Kutilmoqda..." });

      createModal.style.display = "none";
      showRoom();
    };

    document.getElementById("confirm-quick-join").onclick = async () => {
      const name = document.getElementById("joiner-name").value.trim();
      if (!name) return alert("Ismingizni kiriting!");
      if (!selectedRoomToJoin) return alert("Xona topilmadi!");

      currentRoomId = selectedRoomToJoin;
      isHost = false;

      const playerRef = push(ref(database, 'rooms/' + currentRoomId + '/players'));
      myPlayerId = playerRef.key;
      set(playerRef, { name: name, isHost: false, role: "Kutilmoqda..." });

      joinModal.style.display = "none";
      showRoom();
    };

    function showRoom() {
      homeView.style.display = "none";
      roomView.style.display = "block";
      if (isHost) document.getElementById("start-game-btn").style.display = "block";
      listenRoom();
    }

    function listenRoom() {
      onValue(ref(database, 'rooms/' + currentRoomId), (snapshot) => {
        if (!snapshot.exists()) return;
        const roomData = snapshot.val();
        document.getElementById("room-header-title").innerText = roomData.roomName + " (" + currentRoomId + ")";

        const playersObj = roomData.players || {};
        const seatsContainer = document.getElementById("seats-container");
        seatsContainer.innerHTML = "";

        const maxSlots = roomData.maxPlayers || 16;
        const playersList = Object.entries(playersObj);

        for (let i = 0; i < maxSlots; i++) {
          const seat = document.createElement("div");
          seat.className = "seat-box";

          if (i < playersList.length) {
            const [pKey, pVal] = playersList[i];
            seat.classList.add("occupied");
            seat.innerHTML = `
              <img src="https://images.unsplash.com/photo-1534447677768-be436bb09401?q=80&w=100" class="player-avatar" alt="Avatar">
              <div style="font-weight:bold; font-size:14px; color:#fff;">${pVal.name}</div>
              <div style="font-size:11px; color:${pVal.isHost ? 'var(--accent-gold)' : 'var(--accent-green)'}; margin-top:2px;">${pVal.isHost ? '👑 Xona egasi' : 'O‘yinchi'}</div>
            `;

            if (pKey === myPlayerId && pVal.role && pVal.role !== "Kutilmoqda...") {
              document.getElementById("my-role-card").innerText = "Sizning rolingiz: " + pVal.role;
            }
          } else {
            seat.innerHTML = `
              <div style="font-size: 20px; color: #555;">+</div>
              <div style="font-size: 11px; color: #666; margin-top:2px;">Bo'sh joy</div>
            `;
          }
          seatsContainer.appendChild(seat);
        }
      });
    }

    onValue(ref(database, 'rooms'), (snapshot) => {
      const container = document.getElementById("rooms-container");
      container.innerHTML = "";

      if (!snapshot.exists()) {
        container.innerHTML = '<p style="color: var(--text-sub); font-size: 14px; text-align: center; margin-top: 30px;">Hozircha ochiq xonalar yo\'q...</p>';
        return;
      }

      snapshot.forEach((child) => {
        const rId = child.key;
        const rData = child.val();

        if (rData.status === "waiting") {
          const playersCount = rData.players ? Object.keys(rData.players).length : 0;
          const maxPlayers = rData.maxPlayers || 16;
          
          const card = document.createElement("div");
          card.className = "room-card";
          card.innerHTML = `
            <div class="room-info-left">
              <div class="room-header">
                <span class="badge-pro">Pro</span>
                <span class="room-name">${rData.roomName || 'Xona'}</span>
                <span class="room-players-count">${playersCount}/${maxPlayers}</span>
              </div>
              <div class="room-users-avatars">
                <span>👤 Yaratuvchi: ${rData.createdBy}</span>
              </div>
            </div>
            <div class="arrow-right">❯</div>
          `;
          card.onclick = () => {
            selectedRoomToJoin = rId;
            joinModal.style.display = "flex";
          };
          container.appendChild(card);
        }
      });
    });

    document.getElementById("start-game-btn").onclick = async () => {
      const roomSnap = await get(ref(database, 'rooms/' + currentRoomId));
      if (!roomSnap.exists()) return;

      const roomData = roomSnap.val();
      if (roomData.status === "started") return;

      const playersObj = roomData.players || {};
      const players = Object.entries(playersObj).map(([key, val]) => ({ key, ...val }));

      if (players.length < 3) return alert("Kamida 3 ta o'yinchi kerak!");

      const roles = ["Mafiya", "Doktor", "Rais", "Bezori", "Qassob", "Mirshab", "Mafiaboshi", "Xufya", "Tinch aholi"];
      for (let i = players.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [players[i], players[j]] = [players[j], players[i]];
      }

      const updates = {};
      players.forEach((p, idx) => {
        updates['rooms/' + currentRoomId + '/players/' + p.key + '/role'] = roles[idx % roles.length];
      });
      updates['rooms/' + currentRoomId + '/status'] = "started";
      update(ref(database), updates);
    };
  </script>
</body>
</html>
