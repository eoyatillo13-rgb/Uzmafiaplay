<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Play Mafia - UzMafiaplay</title>
  <style>
    :root {
      --bg-color: #0b0e14;
      --card-bg: #151a23;
      --card-border: #222936;
      --accent-gold: #e5ac40;
      --accent-purple: #6a44f2;
      --accent-green: #2ecc71;
      --text-main: #ffffff;
      --text-sub: #7a8290;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 15px;
      box-sizing: border-box;
      user-select: none;
    }

    /* Top Logo Header */
    .top-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin: 10px 0 20px 0;
    }

    .logo-img {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      border: 2px solid var(--accent-gold);
      box-shadow: 0 0 15px rgba(229, 172, 64, 0.4);
      object-fit: cover;
    }

    .logo-title {
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 2px;
      background: linear-gradient(135deg, #fce072, #e5ac40);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: 0;
      text-shadow: 0 2px 10px rgba(0,0,0,0.8);
    }

    /* Icon Bar Row */
    .icon-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding: 0 5px;
    }

    .icon-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #19202c;
      border: 1px solid #2a3344;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
      cursor: pointer;
    }

    .icon-btn img {
      width: 28px;
      height: 28px;
      object-fit: contain;
    }

    /* Main Actions Bar */
    .action-row {
      display: flex;
      gap: 12px;
      margin-bottom: 25px;
    }

    .btn-add {
      width: 65px;
      height: 60px;
      background: linear-gradient(145deg, #2b2112, #18120a);
      border: 2px solid var(--accent-gold);
      border-radius: 18px;
      color: var(--accent-gold);
      font-size: 28px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(229, 172, 64, 0.2);
    }

    .btn-quick {
      flex: 1;
      height: 60px;
      background: linear-gradient(135deg, #7b52ff, #5022ed);
      border: none;
      border-radius: 18px;
      color: white;
      font-size: 17px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(106, 68, 242, 0.4);
    }

    .section-title {
      font-size: 13px;
      color: var(--text-sub);
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      text-align: left;
      margin-bottom: 12px;
    }

    /* Room Cards List */
    .room-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }

    .room-info-left { text-align: left; }
    .room-header { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .badge-pro { background: var(--accent-gold); color: #000; font-size: 10px; font-weight: 900; padding: 2px 6px; border-radius: 6px; }
    .room-name { font-size: 16px; font-weight: bold; color: #fff; }
    .room-players-count { color: var(--accent-green); font-size: 14px; font-weight: bold; }
    .room-users-avatars { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-sub); }
    .avatar-mini { width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--accent-gold); object-fit: cover; }
    .arrow-right { color: var(--text-sub); font-size: 18px; }

    /* Seats Grid */
    .seats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin: 15px 0;
    }

    .seat-box {
      background: var(--card-bg);
      border: 1px dashed var(--card-border);
      border-radius: 16px;
      padding: 16px 10px;
      text-align: center;
      min-height: 85px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .seat-box.occupied {
      border: 1px solid var(--accent-purple);
      background: #1c2230;
    }

    .player-avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 2px solid var(--accent-gold);
      margin-bottom: 6px;
      object-fit: cover;
    }

    /* Roles Grid (Qoidalar bo'limi uchun) */
    .roles-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-top: 15px;
    }

    .role-card {
      background: #19202c;
      border: 1px solid var(--card-border);
      border-radius: 16px;
      overflow: hidden;
      text-align: center;
      padding-bottom: 10px;
    }

    .role-img {
      width: 100%;
      height: 120px;
      object-fit: cover;
    }

    .role-name {
      font-size: 14px;
      font-weight: bold;
      color: #fff;
      margin-top: 8px;
    }

    /* Modals */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.85);
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    .modal-content {
