<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mafia Lobby</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131b2e;
            --card-border: #1e293b;
            --accent-yellow: #f59e0b;
            --accent-purple: #8b5cf6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
        }

        /* Banner qismi - Play Mafia */
        .banner {
            background: linear-gradient(135deg, #1a233a 0%, #0f172a 100%);
            border: 2px solid #334155;
            border-radius: 16px;
            padding: 25px 15px;
            text-align: center;
            margin-bottom: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .banner-title {
            font-size: 32px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 3px;
            background: linear-gradient(to bottom, #fbbf24 30%, #d97706 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
            margin: 0 0 5px 0;
        }

        .banner-subtitle {
            font-size: 11px;
            color: var(--text-muted);
            letter-spacing: 2px;
        }

        /* Yuqori kichik ikonka tugmalar paneli */
        .top-icons {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 15px;
        }

        .icon-btn {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            flex: 1;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
            transition: 0.2s;
        }

        .icon-btn:hover {
            border-color: var(--accent-yellow);
            transform: translateY(-2px);
        }

        /* Asosiy harakat tugmalari (Yaratish va Tezkor qo'shilish) */
        .action-row {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        .create-room-btn {
            background-color: var(--card-bg);
            border: 2px solid #475569;
            border-radius: 14px;
            width: 65px;
            height: 55px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: var(--accent-yellow);
            cursor: pointer;
            transition: 0.2s;
        }

        .quick-join-btn {
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            border: none;
            border-radius: 14px;
            flex: 1;
            height: 55px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4);
            transition: 0.2s;
        }

        .quick-join-btn:hover, .create-room-btn:hover {
            opacity: 0.95;
            transform: scale(1.02);
        }

        .qr-btn {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            width: 55px;
            height: 55px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
        }

        /* Xonalar ro'yxati sarlavhasi */
        .section-title {
            font-size: 13px;
            text-transform: uppercase;
            color: var(--text-muted);
            letter-spacing: 1px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Xona kartochkalari */
        .room-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 15px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: 0.2s;
        }

        .room-card:hover {
            border-color: #334155;
            background-color: #162037;
        }

        .room-info h4 {
            margin: 0 0 6px 0;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .room-stats {
            font-size: 13px;
            color: #4ade80;
            font-weight: 600;
        }

        .room-players {
            display: flex;
            align-items: center;
            gap: 4px;
            margin-top: 8px;
        }

        .player-dot {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background-color: #334155;
            border: 1px solid #475569;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
        }

        .room-arrow {
            color: var(--text-muted);
            font-size: 18px;
        }

        .badge-voice {
            background-color: rgba(74, 222, 128, 0.1);
            color: #4ade80;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            border: 1px solid rgba(74, 222, 128, 0.2);
        }
    </style>
</head>
<body>

<div class="container">

    <!-- Play Mafia tilla rangli banneri -->
    <div class="banner">
        <h1 class="banner-title">PLAY MAFIA</h1>
        <div class="banner-subtitle">ONLINE OYIN PLATFORMASI</div>
    </div>

    <!-- Yuqori ikonka tugmalar -->
    <div class="top-icons">
        <div class="icon-btn">☀️</div>
        <div class="icon-btn">⏳</div>
        <div class="icon-btn">📖</div>
        <div class="icon-btn">🏆</div>
        <div class="icon-btn">🏛️</div>
        <div class="icon-btn">👑</div>
    </div>

    <!-- Asosiy tugmalar (Xona ochish va Tezkor qo'shilish) -->
    <div class="action-row">
        <div class="create-room-btn" onclick="alert('Yangi xona ochish')">+</div>
        <button class="quick-join-btn">
            ⚡ Tezkor qo'shilish
        </button>
        <div class="qr-btn">📷</div>
    </div>

    <!-- Ochiq xonalar ro'yxati -->
    <div class="section-title">👥 Ochiq xonalar</div>

    <!-- 5-Xona misoli -->
    <div class="room-card" onclick="alert('5-xona ochildi')">
        <div class="room-info">
            <h4>5-Xona</h4>
            <div class="room-stats">5/16</div>
            <div class="room-players">
                <div class="player-dot">👻</div>
                <div class="player-dot">❌</div>
                <div class="player-dot">👤</div>
                <div class="player-dot">🌊</div>
                <span style="font-size: 12px; color: var(--text-muted); margin-left: 5px;">Hikmatillo Ganiyev</span>
            </div>
        </div>
        <div class="room-arrow">›</div>
    </div>

    <!-- 3-Ovozli Xona misoli -->
    <div class="room-card" onclick="alert('3-xona ochildi')">
        <div class="room-info">
            <h4><span class="badge-voice">🎙️ Ovozli</span> 3-Xona</h4>
            <div class="room-stats" style="color: #f87171;">15/16</div>
            <div class="room-players">
                <div class="player-dot">👑</div>
                <div class="player-dot">⚡</div>
                <div class="player-dot">💎</div>
                <div class="player-dot">🦉</div>
                <span style="font-size: 12px; color: var(--text-muted); margin-left: 5px;">+10 AYUBCHIK</span>
            </div>
        </div>
        <div class="room-arrow">›</div>
    </div>

    <!-- 1-Ovozli Xona misoli -->
    <div class="room-card" onclick="alert('1-xona ochildi')">
        <div class="room-info">
            <h4><span class="badge-voice">🎙️ Ovozli</span> 1-Xona</h4>
            <div class="room-stats">1/16</div>
            <div class="room-players">
                <div class="player-dot">👤</div>
                <span style="font-size: 12px; color: var(--text-muted); margin-left: 5px;">Lukmanov</span>
            </div>
        </div>
        <div class="room-arrow">›</div>
    </div>

</div>

</body>
</html>
