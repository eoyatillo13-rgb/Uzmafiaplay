<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Play Mafia</title>
  <style>
    body {
      background-color: #0b0c10;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 15px;
      text-align: center;
    }
    .top-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
      margin: 15px 0 20px 0;
    }
    .logo-circle {
      width: 65px;
      height: 65px;
      border-radius: 50%;
      border: 2px solid #e67e22;
      background: radial-gradient(circle, #333 0%, #111 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      box-shadow: 0 4px 10px rgba(230, 126, 34, 0.3);
    }
    .logo-title {
      font-size: 24px;
      font-weight: 900;
      letter-spacing: 2px;
      color: #f1c40f;
    }
    .action-row {
      display: flex;
      gap: 10px;
      margin-bottom: 25px;
    }
    .btn-create {
      background: #1f2029;
      border: 2px solid #e67e22;
      border-radius: 16px;
      width: 60px;
      height: 55px;
      font-size: 24px;
      color: #e67e22;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn-quick {
      flex: 1;
      background: linear-gradient(135deg, #7c4dff, #512da8);
      border: none;
      border-radius: 16px;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .section-header {
      text-align: left;
      font-size: 13px;
      color: #7f8c8d;
      font-weight: bold;
      letter-spacing: 1px;
      margin-bottom: 12px;
      text-transform: uppercase;
    }
    .room-card {
      background: #15161d;
      border: 1px solid #22232f;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 12px;
      text-align: left;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .room-card:hover { border-color: #e67e22; }
    .room-title-text {
      font-size: 16px;
      font-weight: bold;
      color: #ffffff;
      margin-bottom: 4px;
    }
    .room-details {
      font-size: 13px;
      color: #2ecc71;
    }
    /* Modal oynalar (Rasmdagi sozlamalar uslubida) */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      justify-content: center;
      align-items: center;
      z-index: 100;
    }
    .modal-content {
      background: #15161d;
      border: 1px solid #2c2d3c;
      padding: 20px;
      border-radius: 20px;
      width: 90%;
      max-width: 380px;
      text-align: left;
      box-sizing: border-box;
      max-height: 90vh;
      overflow-y: auto;
    }
    input[type="text"], input[type="number"] {
      width: 100%;
      padding: 12px;
      margin: 8px 0 15px 0;
      border-radius: 12px;
      border: 1px solid #2c2d3c;
      background: #0b0c10;
      color: #fff;
      font-size: 15px;
      box-sizing: border-box;
    }
    .form-label {
      font-size: 12px;
      color: #7f8c8d;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .btn-main {
      background: #512da8;
      color: white;
      font-weight: bold;
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-size: 16px;
      margin-top: 15px;
      text-align: center;
    }
    /* O'yin ichidagi o'rindiqlar gridi (Rasmdagidek) */
    .seats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin: 15px 0;
    }
    .seat-box {
      background: #15161d;
      border: 1px solid #22232f;
      border-radius: 14px;
      padding: 15px 10px;
      text-align: center;
      min-height: 70px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .seat-box.occupied {
      border-color: #512da8;
      background: #191a23;
    }
  </style>
</head>
<body>

  <!-- Asosiy ekran -->
  <div id="home-view">
    <div class="top-header">
      <div class="logo-circle">🕵️‍♂️</div>
      <div class="logo-title">PLAY MAFIA</div>
    </div>

    <div class="action-row">
      <button class="btn-create" id="open-create-modal" title="Xona ochish">➕</button>
      <button class="btn-quick" id="quick-join-btn">⚡ Tezkor qo'shilish</button>
    </div>

    <div class="section-header">Ochiq xonalar</div>
    <div id="rooms-container">
      <p style="color: #555; font-size: 14px; margin-top: 20px;">Hozircha ochiq xonalar yo'q...</p>
    </div>
  </div>

  <!-- O'yin xonasi (O'rindiqlar ko'rinishi) -->
  <div id="room-view" style="display: none;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
      <h3 id="room-header-title" style="color: #f1c40f; margin: 0;">Xona</h3>
      <button onclick="location.reload()" style="background:#e74c3c; border:none; color:white; padding:6px 12px; border-radius:8px; cursor:pointer;">Chiqish</button>
    </div>

    <div id="my-role-card" style="font-size: 16px; font-weight: bold; color: #2ecc71; margin-bottom: 10px; background: #15161d; padding: 10px; border-radius: 10px;">Rol kutilmoqda...</div>
    
    <div class="section-header">O'rindiqlar (O'yinchilar):</div>
    <div class="seats-grid" id="seats-container"></div>

    <button id="start-game-btn" class="btn-main" style="display: none; background: #2ecc71;">O'yinni boshlash ▶</button>
  </div>

  <!-- Xona ochish oynasi (Rasmdagi sozlamalar bo'yicha) -->
  <div class="modal" id="create-modal">
    <div class="modal-content">
      <h3 style="color: #f1c40f; margin-top:0;">Yangi xona</h3>
      
      <div class="form-label">Ismingiz</div>
      <input type="text" id="creator-name" placeholder="Ismingizni kiriting...">

      <div class="form-label">Xona nomi (ixtiyoriy)</div>
      <input type="text" id="room-name-input" placeholder="Masalan: Do'stlar davrasi">

      <div class="form-label">O'yinchilar soni</div>
      <input type="number" id="max-players-input" value="6" min="3" max="16">

      <button class="btn-main" id="confirm-create">Yaratish</button>
      <button onclick="closeAllModals()" style="background:none; border:none; color:#7f8c8d; margin-top:15px; cursor:pointer; width:100%; text-align:center;">Bekor qilish</button>
    </div>
  </div>

  <!-- Ism kiritib qo'shilish oynasi -->
  <div class="modal" id="join-modal">
    <div class="modal-content">
      <h3 style="color: #f1c40f; margin-top:0;">Xonaga qo'shilish</h3>
      
      <div class="form-label">Ismingiz</div>
      <input type="text" id="joiner-name" placeholder="Ismingizni kiriting...">

      <button class="btn-main" id="confirm-quick-join">O'yinga qo'shilish</button>
      <button onclick="closeAllModals()" style="background:none; border:none; color:#7f8c8d; margin-top:15px; cursor:pointer; width:100%; text-align:center;">Bekor qilish</button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, onValue, push, get, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCWlfG8IlwFQuSm96CPQY4DmfVZJvg606w",
      authDomain: "uzmafiaplay-fbe1b.firebaseapp.com",
      databaseURL: "https://uzmafiaplay-fbe1b-default-rtdb.firebaseio.com",
      projectId: "uzmafiaplay-fbe1b",
      storageBucket: "uzmafiaplay-fbe1b.firebasestorage.app",
      messagingSenderId: "897774965825",
      appId: "1:897774965825:web:90c821fbcc7972120622c0"
    };

    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);

    let currentRoomId = null;
    let myPlayerId = null;
    let isHost = false;
    let selectedRoomToJoin = null;

    const homeView = document.getElementById("home-view");
    const roomView = document.getElementById("room-view");
    const createModal = document.getElementById("create-modal");
    const joinModal = document.getElementById("join-modal");

    document.getElementById("open-create-modal").onclick = () => createModal.style.display = "flex";
    
    document.getElementById("quick-join-btn").onclick = async () => {
      const snapshot = await get(ref(database, 'rooms'));
      if (!snapshot.exists()) return alert("Hozircha ochiq xonalar yo'q!");
      
      let foundRoom = null;
      snapshot.forEach((child) => {
        if (child.val().status === "waiting" && !foundRoom) {
          foundRoom = child.key;
        }
      });

      if (!foundRoom) return alert("Hozircha ochiq xonalar yo'q!");
      selectedRoomToJoin = foundRoom;
      joinModal.style.display = "flex";
    };

    window.closeAllModals = () => {
      createModal.style.display = "none";
      joinModal.style.display = "none";
    };

    // Xona yaratish
    document.getElementById("confirm-create").onclick = () => {
      const name = document.getElementById("creator-name").value.trim();
      const roomTitle = document.getElementById("room-name-input").value.trim() || "Do'stlar davrasi";
      const maxPlayers = parseInt(document.getElementById("max-players-input").value) || 6;

      if (!name) return alert("Iltimos, ismingizni kiriting!");

      currentRoomId = Math.floor(1000 + Math.random() * 9000);
      isHost = true;

      set(ref(database, 'rooms/' + currentRoomId), {
        roomName: roomTitle,
        createdBy: name,
        maxPlayers: maxPlayers,
        status: "waiting",
        createdAt: Date.now()
      });

      const playerRef = push(ref(database, 'rooms/' + currentRoomId + '/players'));
      myPlayerId = playerRef.key;
      set(playerRef, { name: name, isHost: true, role: "Kutilmoqda..." });

      closeAllModals();
      showRoom();
    };

    // Xonaga qo'shilish
    document.getElementById("confirm-quick-join").onclick = async () => {
      const name = document.getElementById("joiner-name").value.trim();
      if (!name) return alert("Iltimos, ismingizni kiriting!");
      if (!selectedRoomToJoin) return alert("Xona topilmadi!");

      currentRoomId = selectedRoomToJoin;
      isHost = false;

      const playerRef = push(ref(database, 'rooms/' + currentRoomId + '/players'));
      myPlayerId = playerRef.key;
      set(playerRef, { name: name, isHost: false, role: "Kutilmoqda..." });

      closeAllModals();
      showRoom();
    };

    function showRoom() {
      homeView.style.display = "none";
      roomView.style.display = "block";
      if (isHost) document.getElementById("start-game-btn").style.display = "block";
      listenRoom();
    }

    function listenRoom() {
      onValue(ref(database, 'rooms/' + currentRoomId), (snapshot) => {
        if (!snapshot.exists()) return;
        const roomData = snapshot.val();
        document.getElementById("room-header-title").innerText = roomData.roomName + " (" + currentRoomId + ")";

        const playersObj = roomData.players || {};
        const seatsContainer = document.getElementById("seats-container");
        seatsContainer.innerHTML = "";

        const maxSlots = roomData.maxPlayers || 6;
        const playersList = Object.entries(playersObj);

        for (let i = 0; i < maxSlots; i++) {
          const seat = document.createElement("div");
          seat.className = "seat-box";

          if (i < playersList.length) {
            const [pKey, pVal] = playersList[i];
            seat.classList.add("occupied");
            seat.innerHTML = `
              <div style="font-weight:bold; font-size:14px; color:#fff;">${pVal.name}</div>
              <div style="font-size:11px; color:${pVal.isHost ? '#f1c40f' : '#2ecc71'}; margin-top:4px;">${pVal.isHost ? '👑 Xona egasi' : 'O‘yinchi'}</div>
            `;

            if (pKey === myPlayerId && pVal.role && pVal.role !== "Kutilmoqda...") {
              document.getElementById("my-role-card").innerText = "Sizning rolingiz: " + pVal.role;
            }
          } else {
            seat.innerHTML = `
              <div style="font-size: 20px; color: #444;">+</div>
              <div style="font-size: 11px; color: #555; margin-top:2px;">Bo'sh joy</div>
            `;
          }
          seatsContainer.appendChild(seat);
        }
      });
    }

    // Ochiq xonalar ro'yxati
    onValue(ref(database, 'rooms'), (snapshot) => {
      const container = document.getElementById("rooms-container");
      container.innerHTML = "";

      if (!snapshot.exists()) {
        container.innerHTML = '<p style="color: #555; font-size: 14px; margin-top: 20px;">Hozircha ochiq xonalar yo\'q...</p>';
        return;
      }

      snapshot.forEach((child) => {
        const rId = child.key;
        const rData = child.val();

        if (rData.status === "waiting") {
          const card = document.createElement("div");
          card.className = "room-card";
          card.innerHTML = `
            <div>
              <div class="room-title-text">${rData.roomName || 'Xona'}</div>
              <div class="room-details">Yaratuvchi: ${rData.createdBy} ➔ Kirish</div>
            </div>
            <div style="color: #e67e22; font-size: 14px; font-weight: bold;">O'ynash</div>
          `;
          card.onclick = () => {
            selectedRoomToJoin = rId;
            document.getElementById("join-modal").style.display = "flex";
          };
          container.appendChild(card
