<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Play Mafia - UzMafiaplay</title>
  <style>
    body {
      background-color: #0b0c10;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 15px;
      text-align: center;
    }
    .top-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
      margin: 15px 0 20px 0;
    }
    .logo-circle {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      border: 2px solid #e67e22;
      background: radial-gradient(circle, #333 0%, #111 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      box-shadow: 0 4px 10px rgba(230, 126, 34, 0.3);
    }
    .logo-title {
      font-size: 24px;
      font-weight: 900;
      letter-spacing: 2px;
      color: #f1c40f;
    }
    .icon-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #15161d;
      padding: 10px 15px;
      border-radius: 16px;
      margin-bottom: 20px;
      gap: 10px;
    }
    .icon-item {
      background: #1f2029;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      border: 1px solid #2c2d3c;
    }
    .action-row {
      display: flex;
      gap: 10px;
      margin-bottom: 25px;
    }
    .btn-create {
      background: #1f2029;
      border: 2px solid #e67e22;
      border-radius: 16px;
      width: 60px;
      height: 55px;
      font-size: 24px;
      color: #e67e22;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn-quick {
      flex: 1;
      background: linear-gradient(135deg, #7c4dff, #512da8);
      border: none;
      border-radius: 16px;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .section-header {
      text-align: left;
      font-size: 13px;
      color: #7f8c8d;
      font-weight: bold;
      letter-spacing: 1px;
      margin-bottom: 12px;
      text-transform: uppercase;
    }
    .room-card {
      background: #15161d;
      border: 1px solid #22232f;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 12px;
      text-align: left;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .room-card:hover { border-color: #e67e22; }
    .room-title-text {
      font-size: 16px;
      font-weight: bold;
      color: #ffffff;
      margin-bottom: 4px;
    }
    .room-details {
      font-size: 13px;
      color: #2ecc71;
    }
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      justify-content: center;
      align-items: center;
      z-index: 100;
    }
    .modal-content {
      background: #15161d;
      border: 1px solid #2c2d3c;
      padding: 25px;
      border-radius: 20px;
      width: 85%;
      max-width: 340px;
      text-align: center;
    }
    input {
      width: 100%;
      padding: 14px;
      margin: 10px 0;
      border-radius: 12px;
      border: 1px solid #2c2d3c;
      background: #0b0c10;
      color: #fff;
      font-size: 16px;
      box-sizing: border-box;
      text-align: center;
    }
    .btn-main {
      background: #e67e22;
      color: #000;
      font-weight: bold;
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-size: 16px;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <!-- Asosiy ekran -->
  <div id="home-view">
    <div class="top-header">
      <div class="logo-circle">🕵️‍♂️</div>
      <div class="logo-title">PLAY MAFIA</div>
    </div>

    <div class="icon-row">
      <div class="icon-item">☀️</div>
      <div class="icon-item">⏳</div>
      <div class="icon-item">📜</div>
      <div class="icon-item">🏆</div>
      <div class="icon-item">🏕️</div>
      <div class="icon-item">👑</div>
    </div>

    <div class="action-row">
      <button class="btn-create" id="open-create-modal" title="Xona ochish">➕</button>
      <button class="btn-quick" id="quick-join-btn">⚡ Tezkor qo'shilish</button>
    </div>

    <div class="section-header">Ochiq xonalar</div>
    <div id="rooms-container">
      <p style="color: #555; font-size: 14px; margin-top: 20px;">Hozircha ochiq xonalar yo'q...</p>
    </div>
  </div>

  <!-- O'yin xonasi -->
  <div id="room-view" style="display: none;">
    <h2 id="room-header-title" style="color: #f1c40f;">Xona kodi: -</h2>
    <div id="my-role-card" style="font-size: 18px; font-weight: bold; color: #2ecc71; margin: 20px 0;"></div>
    
    <div class="section-header">O'yinchilar ro'yxati:</div>
    <ul id="players-ul" style="list-style: none; padding: 0; text-align: left;"></ul>

    <button id="start-game-btn" class="btn-main" style="display: none; background: #2ecc71; color: white;">O'yinni boshlash ▶</button>
    <button onclick="location.reload()" class="btn-main" style="background: #e74c3c; color: white; margin-top: 10px;">Xonadan chiqish</button>
  </div>

  <!-- Xona ochish uchun ism kiritish -->
  <div class="modal" id="create-modal">
    <div class="modal-content">
      <h3 style="color: #f1c40f; margin-top:0;">Xona yaratish</h3>
      <input type="text" id="creator-name" placeholder="Ismingizni kiriting...">
      <button class="btn-main" id="confirm-create">Ochish</button>
      <button onclick="closeAllModals()" style="background:none; border:none; color:#7f8c8d; margin-top:15px; cursor:pointer;">Bekor qilish</button>
    </div>
  </div>

  <!-- Tezkor qo'shilish uchun ism kiritish -->
  <div class="modal" id="join-modal">
    <div class="modal-content">
      <h3 style="color: #f1c40f; margin-top:0;">Ismingizni kiriting</h3>
      <input type="text" id="joiner-name" placeholder="Ismingiz...">
      <button class="btn-main" id="confirm-quick-join">Davom etish</button>
      <button onclick="closeAllModals()" style="background:none; border:none; color:#7f8c8d; margin-top:15px; cursor:pointer;">Bekor qilish</button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, onValue, push, get, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCWlfG8IlwFQuSm96CPQY4DmfVZJvg606w",
      authDomain: "uzmafiaplay-fbe1b.firebaseapp.com",
      databaseURL: "https://uzmafiaplay-fbe1b-default-rtdb.firebaseio.com",
      projectId: "uzmafiaplay-fbe1b",
      storageBucket: "uzmafiaplay-fbe1b.firebasestorage.app",
      messagingSenderId: "897774965825",
      appId: "1:897774965825:web:90c821fbcc7972120622c0"
    };

    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);

    let currentRoomId = null;
    let myPlayerId = null;
    let isHost = false;
    let selectedRoomToJoin = null;

    const homeView = document.getElementById("home-view");
    const roomView = document.getElementById("room-view");
    const createModal = document.getElementById("create-modal");
    const joinModal = document.getElementById("join-modal");

    document.getElementById("open-create-modal").onclick = () => createModal.style.display = "flex";
    
    // Tezkor qo'shilish tugmasi (birinchi ochilgan xonaga kirish)
    document.getElementById("quick-join-btn").onclick = async () => {
      const snapshot = await get(ref(database, 'rooms'));
      if (!snapshot.exists()) return alert("Hozircha ochiq xonalar yo'q!");
      
      let foundRoom = null;
      snapshot.forEach((child) => {
        if (child.val().status === "waiting" && !foundRoom) {
          foundRoom = child.key;
        }
      });

      if (!foundRoom) return alert("Hozircha ochiq xonalar yo'q!");
      selectedRoomToJoin = foundRoom;
      joinModal.style.display = "flex";
    };

    window.closeAllModals = () => {
      createModal.style.display = "none";
      joinModal.style.display = "none";
    };

    // Xona yaratish
    document.getElementById("confirm-create").onclick = () => {
      const name = document.getElementById("creator-name").value.trim();
      if (!name) return alert("Iltimos, ismingizni kiriting!");

      currentRoomId = Math.floor(1000 + Math.random() * 9000);
      isHost = true;

      set(ref(database, 'rooms/' + currentRoomId), {
        createdBy: name,
        status: "waiting",
        createdAt: Date.now()
      });

      const playerRef = push(ref(database, 'rooms/' + currentRoomId + '/players'));
      myPlayerId = playerRef.key;
      set(playerRef, { name: name, isHost: true, role: "Kutilmoqda..." });

      closeAllModals();
      showRoom();
    };

    // Ro'yxatdan xonani bosganda yoki tezkor qo'shilganda to'g'ridan-to'g'ri kirish
    document.getElementById("confirm-quick-join").onclick = async () => {
      const name = document.getElementById("joiner-name").value.trim();
      if (!name) return alert("Iltimos, ismingizni kiriting!");
      if (!selectedRoomToJoin) return alert("Xona topilmadi!");

      currentRoomId = selectedRoomToJoin;
      isHost = false;

      const playerRef = push(ref(database, 'rooms/' + currentRoomId + '/players'));
      myPlayerId = playerRef.key;
      set(playerRef, { name: name, isHost: false, role: "Kutilmoqda..." });

      closeAllModals();
      showRoom();
    };

    function showRoom() {
      homeView.style.display = "none";
      roomView.style.display = "block";
      document.getElementById("room-header-title").innerText = "Xona kodi: " + currentRoomId;
      if (isHost) document.getElementById("start-game-btn").style.display = "block";
      listenRoom();
    }

    function listenRoom() {
      onValue(ref(database, 'rooms/' + currentRoomId + '/players'), (snapshot) => {
        const ul = document.getElementById("players-ul");
        ul.innerHTML = "";
        snapshot.forEach((child) => {
          const p = child.val();
          const li = document.createElement("li");
          li.style.background = "#15161d";
          li.style.border = "1px solid #22232f";
          li.style.padding = "10px 15px";
          li.style.margin = "6px 0";
          li.style.borderRadius = "12px";
          li.innerHTML = `${p.name} ${p.isHost ? '👑 <span style="color:#f1c40f; font-size:12px;">Xona egasi</span>' : ''}`;
          ul.appendChild(li);

          // Rol bir marta yozilsa, qayta o'zgarmasligi uchun bazadagi qiymatni qulflaymiz
          if (child.key === myPlayerId && p.role && p.role !== "Kutilmoqda...") {
            document.getElementById("my-role-card").innerText = "Sizning rolingiz: " + p.role;
          }
        });
      });
    }

    // Ochiq xonalar ro'yxati (ustiga bossa kod kiritmasdan kiradi)
    onValue(ref(database, 'rooms'), (snapshot) => {
      const container = document.getElementById("rooms-container");
      container.innerHTML = "";

      if (!snapshot.exists()) {
        container.innerHTML = '<p style="color: #555; font-size: 14px; margin-top: 20px;">Hozircha ochiq xonalar yo\'q...</p>';
        return;
      }

      snapshot.forEach((child) => {
        const rId = child.key;
        const rData = child.val();

        if (rData.status === "waiting") {
          const card = document.createElement("div");
          card.className = "room-card";
          card.innerHTML = `
            <div>
              <div class="room-title-text">${rData.createdBy} ning xonasi</div>
              <div class="room-details">Qo'shilish uchun bosing ➔</div>
            </div>
            <div style="color: #e67e22; font-size: 14px; font-weight: bold;">Kirish</div>
          `;
          card.onclick = () => {
            selectedRoomToJoin = rId;
            document.getElementById("join-modal").style.display = "flex";
          };
          container.appendChild(card);
        }
      });
    });

    // O'yinni boshlash (faqat bir marta rol taqsimlaydi va bazada saqlaydi)
    document.getElementById("start-game-btn").onclick = async () => {
      const roomRef = ref(database, 'rooms/' + currentRoomId);
      const snapshot = await get(roomRef);
      if (!snapshot.exists()) return;

      const roomData = snapshot.val();
      // Agar o'yin allaqachon boshlangan bo'lsa, rollarni qayta aralashtirmaymiz!
      if (roomData.status === "started") return;

      const playersSnap = await get(ref(database, 'rooms/' + currentRoomId + '/players'));
      if (!playersSnap.exists()) return;

      const players = [];
      playersSnap.forEach((child) => players.push({ key: child.key, ...child.val() }));

      if (players.length < 3) return alert("O'yin uchun kamida 3 ta o'yinchi kerak!");

      const roles = ["Mafiya", "Shifokor", "Komissar", "Tinch aholi", "Tinch aholi"];
      for (let i = players.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [players[i], players[j]] = [players[j], players[i]];
      }

      const updates = {};
      players.forEach((p, idx) => {
        updates['rooms/' + currentRoomId + '/players/' + p.key + '/role'] = roles[idx] || "Tinch aholi";
      });
      updates['rooms/' + currentRoomId + '/status'] = "started";
      update(ref(database), updates);
    };
  </script>
</body>
</html>
