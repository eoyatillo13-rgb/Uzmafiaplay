<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAFIA PLAY UZ</title>
    <style>
        :root {
            --card-bg: rgba(17, 24, 39, 0.85); /* Shaffofroq card foni */
            --card-border: rgba(251, 191, 36, 0.3);
            --accent-gold: #fbbf24;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --green: #22c55e;
            --red: #ef4444;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            /* Orqa fonga siz tashlagan rasm ulanadi (rasm fayl nomini 'logo.jpg' deb saqlang) */
            background: linear-gradient(rgba(7, 9, 19, 0.8), rgba(7, 9, 19, 0.9)), url('logo.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--text-main);
            margin: 0;
            padding: 12px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 440px;
        }

        /* Yuqori qismdagi tilla rangli Play Mafia banneri */
        .banner-header {
            text-align: center;
            padding: 15px 0 20px 0;
        }

        .banner-title {
            font-size: 28px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            background: linear-gradient(180deg, #fde047 0%, #d97706 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 2px 6px rgba(0,0,0,0.8));
            margin: 0;
        }

        /* Yuqori kichik ikonka tugmalar paneli */
        .top-icons-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 6px;
            margin-bottom: 15px;
        }

        .top-icon-btn {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            height: 46px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            cursor: pointer;
            backdrop-filter: blur(5px);
            transition: 0.2s;
        }

        .top-icon-btn:active {
            transform: scale(0.95);
        }

        /* Asosiy harakatlar bloki (+, Tezkor qo'shilish, QR) */
        .main-actions-row {
            display: flex;
            gap: 8px;
            margin-bottom: 22px;
        }

        .create-btn {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            width: 55px;
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            color: var(--accent-gold);
            cursor: pointer;
            backdrop-filter: blur(5px);
        }

        .quick-join-btn {
            background: linear-gradient(135deg, #d97706 0%, #b45309 100%);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            flex: 1;
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 15px;
            font-weight: 700;
            color: white;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(217, 119, 6, 0.4);
        }

        .qr-btn {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            width: 52px;
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
            backdrop-filter: blur(5px);
        }

        /* Sarlavha: Ochiq xonalar */
        .section-header {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--accent-gold);
            letter-spacing: 0.5px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
            text-shadow: 0 1px 2px rgba(0,0,0,0.5);
        }

        /* Xona kartochkasi */
        .room-item {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            backdrop-filter: blur(8px);
            transition: 0.2s;
        }

        .room-item:active {
            background-color: rgba(31, 41, 55, 0.9);
        }

        .room-details h4 {
            margin: 0 0 4px 0;
            font-size: 15px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .room-count {
            font-size: 13px;
            font-weight: 600;
            color: var(--green);
        }

        .room-count.full {
            color: var(--red);
        }

        .avatars-row {
            display: flex;
            align-items: center;
            gap: 4px;
            margin-top: 8px;
        }

        .avatar-badge {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background-color: rgba(31, 41, 55, 0.8);
            border: 1px solid var(--card-border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
        }

        .host-name {
            font-size: 12px;
            color: var(--text-muted);
            margin-left: 4px;
        }

        .arrow-icon {
            color: var(--accent-gold);
            font-size: 16px;
        }

        .badge-voice {
            background-color: rgba(34, 197, 94, 0.15);
            color: var(--green);
            font-size: 10px;
            padding: 2px 5px;
            border-radius: 4px;
            font-weight: 600;
            border: 1px solid rgba(34, 197, 94, 0.3);
        }
    </style>
</head>
<body>

<div class="app-container">

    <!-- Tilla rangli Play Mafia banneri -->
    <div class="banner-header">
        <h1 class="banner-title">PLAY MAFIA</h1>
    </div>

    <!-- 6 ta yuqori ikonka tugmalar -->
    <div class="top-icons-grid">
        <div class="top-icon-btn">☀️</div>
        <div class="top-icon-btn">⏳</div>
        <div class="top-icon-btn">📖</div>
        <div class="top-icon-btn">🏆</div>
        <div class="top-icon-btn">🏛️</div>
        <div class="top-icon-btn">👑</div>
    </div>

    <!-- Asosiy harakat tugmalari -->
    <div class="main-actions-row">
        <div class="create-btn" onclick="alert('Yangi xona ochish')">+</div>
        <button class="quick-join-btn">
            ⚡ Tezkor qo'shilish
        </button>
        <div class="qr-btn" onclick="alert('QR Kod')">📷</div>
    </div>

    <!-- Ochiq xonalar ro'yxati -->
    <div class="section-header">👥 Ochiq xonalar</div>

    <!-- Xona 1 -->
    <div class="room-item" onclick="alert('5-Xonaga kirish')">
        <div class="room-details">
            <h4>5-Xona</h4>
            <div class="room-count">5/16</div>
            <div class="avatars-row">
                <div class="avatar-badge">👻</div>
                <div class="avatar-badge">❌</div>
                <div class="avatar-badge">👤</div>
                <div class="avatar-badge">🌊</div>
                <span class="host-name">Hikmatillo Ganiyev</span>
            </div>
        </div>
        <div class="arrow-icon">›</div>
    </div>

    <!-- Xona 2 (Ovozli) -->
    <div class="room-item" onclick="alert('3-Ovozli xonaga kirish')">
        <div class="room-details">
            <h4><span class="badge-voice">🎙️ Ovozli</span> 3-Xona</h4>
            <div class="room-count full">15/16</div>
            <div class="avatars-row">
                <div class="avatar-badge">👑</div>
                <div class="avatar-badge">⚡</div>
                <div class="avatar-badge">💎</div>
                <div class="avatar-badge">🦉</div>
                <span class="host-name">+10 AYUBCHIK</span>
            </div>
        </div>
        <div class="arrow-icon">›</div>
    </div>

    <!-- Xona 3 (Ovozli) -->
    <div class="room-item" onclick="alert('1-Ovozli xonaga kirish')">
        <div class="room-details">
            <h4><span class="badge-voice">🎙️ Ovozli</span> 1-Xona</h4>
            <div class="room-count">1/16</div>
            <div class="avatars-row">
                <div class="avatar-badge">👤</div>
                <span class="host-name">Lukmanov</span>
            </div>
        </div>
        <div class="arrow-icon">›</div>
    </div>

</div>

</body>
</html>
