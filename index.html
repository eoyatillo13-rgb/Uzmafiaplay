<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UzMafiaplay</title>
  <style>
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
      margin: 0;
    }
    h1 { color: #ff4d4d; }
    .card {
      background: #1e1e1e;
      padding: 20px;
      margin: 20px auto;
      border-radius: 12px;
      max-width: 400px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    input {
      width: 80%;
      padding: 10px;
      margin: 10px 0;
      border-radius: 6px;
      border: 1px solid #444;
      background: #2b2b2b;
      color: #fff;
      font-size: 16px;
    }
    button {
      background-color: #e50914;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
      margin: 5px;
    }
    button:hover { background-color: #b20710; }
    ul { list-style-type: none; padding: 0; }
    li {
      background: #333;
      margin: 5px 0;
      padding: 8px;
      border-radius: 4px;
    }
    .role-badge {
      font-weight: bold;
      color: #ffcc00;
      font-size: 18px;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <h1>UzMafiaplay</h1>
  <p>O'zbekcha Mafia o'yiniga xush kelibsiz!</p>

  <div class="card" id="auth-box">
    <h3>Ismingizni kiriting</h3>
    <input type="text" id="username" placeholder="Ismingiz...">
    <br>
    <button id="create-room-btn">Xona yaratish</button>
  </div>

  <div class="card" id="room-box" style="display: none;">
    <h3 id="room-title">Xona kodi: -</h3>
    <div id="my-role-box" class="role-badge"></div>
    <h4>O'yinchilar ro'yxati:</h4>
    <ul id="players-list"></ul>
    <button id="start-game-btn" style="display: none;">O'yinni boshlash</button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, onValue, push, get, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCWlfG8IlwFQuSm96CPQY4DmfVZJvg606w",
      authDomain: "uzmafiaplay-fbe1b.firebaseapp.com",
      databaseURL: "https://uzmafiaplay-fbe1b-default-rtdb.firebaseio.com",
      projectId: "uzmafiaplay-fbe1b",
      storageBucket: "uzmafiaplay-fbe1b.firebasestorage.app",
      messagingSenderId: "897774965825",
      appId: "1:897774965825:web:90c821fbcc7972120622c0"
    };

    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);

    let currentRoomId = null;
    let myPlayerId = null;

    const createBtn = document.getElementById("create-room-btn");
    const startBtn = document.getElementById("start-game-btn");
    const usernameInput = document.getElementById("username");
    const authBox = document.getElementById("auth-box");
    const roomBox = document.getElementById("room-box");
    const roomTitle = document.getElementById("room-title");
    const playersList = document.getElementById("players-list");
    const myRoleBox = document.getElementById("my-role-box");

    createBtn.addEventListener("click", () => {
      const username = usernameInput.value.trim();
      if (!username) {
        alert("Iltimos, ismingizni kiriting!");
        return;
      }

      currentRoomId = Math.floor(1000 + Math.random() * 9000);

      const roomRef = ref(database, 'rooms/' + currentRoomId);
      set(roomRef, {
        createdBy: username,
        createdAt: Date.now(),
        status: "waiting"
      });

      const playerRef = push(ref(database, 'rooms/' + currentRoomId + '/players'));
      myPlayerId = playerRef.key;
      set(playerRef, {
        name: username,
        role: "Kutilmoqda..."
      });

      authBox.style.display = "none";
      roomBox.style.display = "block";
      startBtn.style.display = "inline-block";
      roomTitle.innerText = "Xona kodi: " + currentRoomId;

      listenToRoom();
    });

    function listenToRoom() {
      onValue(ref(database, 'rooms/' + currentRoomId + '/players'), (snapshot) => {
        playersList.innerHTML = "";
        snapshot.forEach((childSnapshot) => {
          const player = childSnapshot.val();
          const pKey = childSnapshot.key;
          const li = document.createElement("li");
          li.innerText = player.name;
          playersList.appendChild(li);

          if (pKey === myPlayerId && player.role) {
            if (player.role !== "Kutilmoqda...") {
              myRoleBox.innerText = "Sizning rolingiz: " + player.role;
            }
          }
        });
      });
    }

    startBtn.addEventListener("click", async () => {
      const playersRef = ref(database, 'rooms/' + currentRoomId + '/players');
      const snapshot = await get(playersRef);
      if (!snapshot.exists()) return;

      const players = [];
      snapshot.forEach((child) => {
        players.push({ key: child.key, ...child.val() });
      });

      if (players.length < 3) {
        alert("O'yinni boshlash uchun kamida 3 ta o'yinchi kerak!");
        return;
      }

      const roles = ["Mafiya", "Shifokor", "Tinch aholi", "Komissar", "Tinch aholi"];
      for (let i = players.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [players[i], players[j]] = [players[j], players[i]];
      }

      const updates = {};
      players.forEach((p, index) => {
        const assignedRole = roles[index] || "Tinch aholi";
        updates['rooms/' + currentRoomId + '/players/' + p.key + '/role'] = assignedRole;
      });

      updates['rooms/' + currentRoomId + '/status'] = "started";
      update(ref(database), updates);
      alert("O'yin boshlandi! Rolingiz ekranda ko'rsatildi.");
    });
  </script>
</body>
</html>
